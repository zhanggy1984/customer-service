# ============================================================
# customer-service — 共享 infra 模式（全共享方案，2026-08-25 起）
#
# 本 agent 不自带任何中间件，全部依赖共享 infra：
#   mysql  -> infra MySQL（库 customer_service / 账号 csuser）
#   redis  -> infra Redis（db index 1）
#   milvus -> infra Milvus（collection cs_knowledge，已带 cs_ 前缀）
#
# 前置：先部署共享 infra（D:/study/aiprojcet/infra，`docker compose up -d`）。
# 启动：docker compose up -d --build
# 连接：前端 http://localhost:8081 / 后端 http://localhost:8000
#
# 表结构：cs 无 alembic，原靠 mysql 容器 init 脚本建表；共享模式由应用
#   lifespan 启动时执行 backend/sql/init.sql（见 app/infrastructure/schema.py，幂等）。
# ============================================================

name: customer-service

services:
  nginx:
    image: nginx:latest
    container_name: customer-service-nginx
    ports:
      - "8081:80"    # HTTP → 301 重定向到 https
      - "8443:443"   # HTTPS（TLS 终止于此；证书 certs/，自签用 scripts/gen_cert.sh 生成）
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shared-infra

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      - MILVUS_URI=http://milvus:19530
      # HF 模型走离线缓存（hf_cache volume）：bge 模型由本地 volume 加载
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    # 多副本 scale：无固定容器名/宿主端口（静态端口与 --scale 冲突）；原容器名作
    # 网络别名，共享网关按 DNS 多 IP 自动轮询（网关配置零改动）
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      shared-infra:
        aliases:
          - customer-service-backend

volumes:
  hf_cache:

networks:
  shared-infra:
    external: true
    name: shared-infra_shared-infra
