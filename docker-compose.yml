# 智能客服系统 — Docker Compose
#
# 用法:
#   docker compose up -d          # 启动全部服务
#   docker compose down           # 停止
#
# 开发模式: 前端跑本地 Vite dev server (localhost:5173, proxy /api -> localhost:8000),
#           nginx 作为生产入口(静态产物 + /api 反代)。
services:
  nginx:
    image: nginx:latest   # 本地无 nginx:alpine（Docker Hub 拉取超时），用本地已有的 nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # 前端静态产物。Phase 1 为空占位(见 frontend/dist/.gitkeep)，
      # 前端构建后 dist 产物挂载到这里即可被 nginx 直接 serve。
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # 开发阶段 1 个实例。Phase 4 高并发时可扩为 3:
    #   deploy:
    #     replicas: 3
    # 注意: 扩展多实例前需解决向量库共享 volume 多实例并发写问题。
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MILVUS_URI=http://milvus:19530
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      # HF 模型缓存 volume，防止 rebuild 后 bge 模型重新下载
      - hf_cache:/root/.cache/huggingface
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ---- Milvus standalone（milvus + etcd + minio，本地已拉取对应镜像）----
  # 内部仅容器网络可达：backend 走 milvus:19530。宿主机如需 attu 联调，
  # 在 docker-compose.override.yml 加 ports: "19533:19530"（host 19530 已被他项目占用）。
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4   # 与 pymilvus 2.6.x 客户端配套（本地镜像已存在）
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7   # 本地无 redis:7-alpine，用本地已有的 redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: customer_service
      MYSQL_USER: csuser
      MYSQL_PASSWORD: cspass
    # asyncmy 对 mysql_native_password 兼容最稳；mysql:8.0 仍支持该插件
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  hf_cache:
  milvus_data:
  milvus_etcd:
  milvus_minio:
