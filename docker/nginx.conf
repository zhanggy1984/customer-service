# 智能客服系统 — Nginx 配置
# 单入口: 前端静态文件 + /api/* 经统一网关反代（限流已收敛到网关 api-gateway）
user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;   # 4 worker × 4096 = 16384 连接上限
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- 通用反代头 + SSE 长连接参数 ----
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host cs.local;   # 网关按 Host 头路由到 customer-service
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 认证接口: 独立 5r/m 防暴力破解 ----
        location /api/v1/auth/ {
            proxy_pass http://api-gateway:8099;
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- 业务接口: 全局 10000r/s ----
        location /api/ {
            proxy_pass http://api-gateway:8099;
            proxy_buffering off;      # 关键: SSE 逐帧推送，禁止缓冲
            proxy_cache off;
            proxy_read_timeout 3600s; # SSE 长连接不超时
        }

        # ---- 前端路由 (Vue Router history 模式 fallback) ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
