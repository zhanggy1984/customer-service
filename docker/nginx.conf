# 智能客服系统 — Nginx 配置
# 单入口: 前端静态文件 + /api/* 反向代理 + 限流
user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;   # 4 worker × 4096 = 16384 连接上限
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # ---- 限流 zone ----
    # /api 全局 10000r/s，超出 503
    limit_req_zone $binary_remote_addr zone=global:10m rate=10000r/s;
    # auth 端点单独 5r/m，防暴力破解
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_status 503;

    upstream backend_app {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- 通用反代头 + SSE 长连接参数 ----
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 认证接口: 独立 5r/m 防暴力破解 ----
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend_app;
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- 业务接口: 全局 10000r/s ----
        location /api/ {
            limit_req zone=global burst=2000 nodelay;
            proxy_pass http://backend_app;
            proxy_buffering off;      # 关键: SSE 逐帧推送，禁止缓冲
            proxy_cache off;
            proxy_read_timeout 3600s; # SSE 长连接不超时
        }

        # ---- 前端路由 (Vue Router history 模式 fallback) ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
