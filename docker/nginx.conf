# 智能客服系统 — Nginx 配置
# 单入口: 前端静态文件 + /api/* 经统一网关反代（限流已收敛到网关 api-gateway）
# TLS 终止于此（对外唯一入口，宿主端口 8443）；到 api-gateway 保持内网 HTTP。
# 证书: certs/server.crt + certs/server.key（自签，scripts/gen_cert.sh 生成；公网请换 Let's Encrypt）
user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;   # 4 worker × 4096 = 16384 连接上限
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # ---- 通用反代头 + SSE 长连接参数 ----
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host cs.local;   # 网关按 Host 头路由到 customer-service
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 80: 全量 301 到 HTTPS（明文不承载业务）----
    server {
        listen 80;
        server_name _;
        # 外部 HTTPS 端口 8443（host 映射，见 docker-compose.yml）；如改端口需同步
        return 301 https://$host:8443$request_uri;
    }

    # ---- 443: 唯一对外入口（TLS 终止，SSE 走 wss）----
    # 注：镜像为 nginx/1.13.8（本地缓存 latest），http2 须用 listen 内联语法，
    # 且不支持 TLSv1.3（老 OpenSSL），故只开 TLSv1.2。
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2;

        # 安全响应头
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- 认证接口: 独立 5r/m 防暴力破解 ----
        location /api/v1/auth/ {
            proxy_pass http://api-gateway:8099;
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- 业务接口: SSE 逐帧推送，禁止缓冲 ----
        location /api/ {
            proxy_pass http://api-gateway:8099;
            proxy_buffering off;      # 关键: SSE 逐帧推送，禁止缓冲
            proxy_cache off;
            proxy_read_timeout 3600s; # SSE 长连接不超时
        }

        # ---- 前端路由 (Vue Router history 模式 fallback) ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
